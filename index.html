<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Загрузка PNG/JPEG → ссылка</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#1a2a33;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:16px}
.box{background:#f0f6fa;border-radius:20px;padding:24px 20px;max-width:400px;width:100%;text-align:center}
h2{font-size:20px;color:#0c2a36;margin-bottom:4px}
.sub{font-size:13px;color:#3a5b6b;margin-bottom:12px}
.badge{display:flex;gap:8px;justify-content:center;margin-bottom:14px}
.badge span{background:#dce8f0;padding:2px 14px;border-radius:20px;font-size:12px;color:#0f3445}
.drop{background:#fff;border:2px dashed #6b9db8;border-radius:18px;padding:20px 10px;cursor:pointer}
.drop p{font-size:14px;color:#1f4a5e;margin:0}
.drop u{color:#006994}
input{display:none}
#out{display:none;margin-top:12px}
#out img{max-width:100%;max-height:140px;border-radius:12px;background:#fff;border:1px solid #b8d0dd}
.fname{font-size:12px;color:#1f4a5e;background:#e2edf5;padding:2px 14px;border-radius:20px;display:inline-block;margin:6px 0 8px}
.row{display:flex;gap:8px;margin:6px 0 10px}
.row button{flex:1;padding:10px 0;border:none;border-radius:30px;font-size:14px;font-weight:600;cursor:pointer}
.copy{background:#1f5a77;color:#fff}
.copy:active{background:#0f405a}
.clr{background:#d4e2ec;color:#1d4155;border:1px solid #8fb4c9}
.clr:active{background:#b8cedc}
.info{font-size:10px;color:#3a6378;margin-top:12px;background:#dce8f0;padding:3px 14px;border-radius:30px;display:inline-block}
.toast{background:#1f5a77;color:#fff;padding:8px 20px;border-radius:30px;font-size:13px;display:inline-block;margin-top:8px;opacity:0;transition:0.3s}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="box">
<h2>📎 Прямая ссылка</h2>
<div class="sub">PNG / JPEG</div>
<div class="badge"><span>PNG</span><span>JPEG</span></div>
<div class="drop" id="drop"><p>📥 <u>выберите файл</u><br><small style="opacity:.6">или перетащите</small></p><input type="file" id="fileInput" accept=".png,.jpeg,.jpg"></div>
<div id="out">
<img id="imgPreview" src="#" alt="">
<div class="fname" id="fname">image.png</div>
<div class="row">
<button class="copy" id="copyBtn">📋 Копировать</button>
<button class="clr" id="clearBtn">✕ Очистить</button>
</div>
<div id="toast" class="toast">✅ Скопировано!</div>
</div>
<div class="info">⚡ ссылка копируется в буфер</div>
</div>

<script>
(function(){
const drop = document.getElementById('drop');
const input = document.getElementById('fileInput');
const out = document.getElementById('out');
const img = document.getElementById('imgPreview');
const fname = document.getElementById('fname');
const copyBtn = document.getElementById('copyBtn');
const clearBtn = document.getElementById('clearBtn');
const toast = document.getElementById('toast');
let currentUrl = '';

function show(file){
if(!file) return;
if(!['image/png','image/jpeg','image/jpg'].includes(file.type)){
alert('Нужен .png или .jpeg');
reset();
return;
}
const reader = new FileReader();
reader.onload = function(e){
currentUrl = e.target.result;
img.src = currentUrl;
let name = file.name;
if(name.length > 28) name = name.slice(0,26) + '…';
fname.textContent = name;
out.style.display = 'block';
};
reader.readAsDataURL(file);
}

function reset(){
out.style.display = 'none';
img.src = '#';
fname.textContent = '';
currentUrl = '';
input.value = '';
toast.classList.remove('show');
}

function showToast(msg){
toast.textContent = msg || '✅ Скопировано!';
toast.classList.add('show');
setTimeout(function(){ toast.classList.remove('show'); }, 2000);
}

drop.onclick = function(){
input.click();
};

input.onchange = function(){
if(this.files && this.files[0]){
show(this.files[0]);
}
this.value = '';
};

drop.ondragover = function(e){
e.preventDefault();
};

drop.ondrop = function(e){
e.preventDefault();
const f = e.dataTransfer.files[0];
if(f) show(f);
};

copyBtn.onclick = function(){
if(!currentUrl){
showToast('⚠️ Сначала загрузите');
return;
}
if(navigator.clipboard && navigator.clipboard.writeText){
navigator.clipboard.writeText(currentUrl).then(function(){
showToast('✅ Скопировано!');
}).catch(function(){
fallbackCopy();
});
} else {
fallbackCopy();
}
};

function fallbackCopy(){
const ta = document.createElement('textarea');
ta.value = currentUrl;
ta.style.position = 'fixed';
ta.style.left = '-9999px';
ta.style.top = '0';
ta.style.width = '1px';
ta.style.height = '1px';
ta.style.opacity = '0';
ta.style.pointerEvents = 'none';
document.body.appendChild(ta);
ta.select();
try {
document.execCommand('copy');
showToast('✅ Скопировано!');
} catch(e) {
showToast('❌ Ошибка');
}
document.body.removeChild(ta);
}

clearBtn.onclick = function(){
reset();
};

document.ondragover = function(e){ e.preventDefault(); };
document.ondrop = function(e){ e.preventDefault(); };

reset();
})();
</script>
</body>
</html>
